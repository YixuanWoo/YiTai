name: build-and-test

# 目的只有一个：任何一次改动把"能编译 / 冒烟测试能过"弄坏了，立刻知道。
# 不打包、不发版 —— 发版是手动的事（见 README 的 build.ps1 -Release）。

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows · 编译 + 冒烟测试
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore YiTai.slnx

      - name: 编译
        # -warnaserror：警告一律按错误处理，编译阶段就钉死"0 警告 0 错误"
        run: dotnet build YiTai.slnx -c Debug --nologo --no-restore -warnaserror

      - name: 冒烟测试
        # 这套测试没有测试框架，靠退出码：0 = 全过，非 0 = 有失败。
        # 项数守门：收尾行必须是「全部通过 ✓（N 项）」且 N ≥ 202（当前基线，只增不减），
        # 防止有人删测试让门禁"变绿"。
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $out = & dotnet run --project tests\YiTai.Tests -c Debug --no-build 2>&1
          $out | ForEach-Object { $_.ToString() } | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "冒烟测试退出码 $LASTEXITCODE（非 0 即失败）"; exit $LASTEXITCODE }
          $last = ($out | Select-Object -Last 1).ToString()
          $m = [regex]::Match($last, '全部通过 ✓（(\d+) 项）')
          if (-not $m.Success) { Write-Host "冒烟测试没有以『全部通过 ✓（N 项）』收尾，末行：$last"; exit 1 }
          $n = [int]$m.Groups[1].Value
          if ($n -lt 202) { Write-Host "冒烟测试 $n 项，低于基线 202 项"; exit 1 }
          Write-Host "冒烟测试 $n 项全过（基线 202 项）✓"
